name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so Dependabot doesn't pile up minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # go.sum is not committed in this repo; generate it so build + tests are
      # reproducible within this run.
      - name: Resolve module graph
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      # Install + run govulncheck directly. The official
      # golang/govulncheck-action@v1 pins actions/checkout@v4.1.1
      # internally, which clashes with our outer actions/checkout@v7
      # (HTTP 400 on the nested fetch).
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    name: frontend (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Only fail the build on high/critical CVEs in production deps so weekly
      # dev-dep noise doesn't block PRs. Dependabot still files PRs for the rest.
      - name: npm audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
